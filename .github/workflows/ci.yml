name: Cortexa AI CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint, Test & Container Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest ruff

      - name: Run Ruff Lint
        run: |
          ruff check apps/api

      - name: Run Pytest Test Suite
        env:
          APP_ENV: test
          SUPABASE_URL: https://mock-test.supabase.co
          SUPABASE_ANON_KEY: mock-test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-test-service-key
          SUPABASE_JWT_SECRET_OR_JWKS_URL: mock-test-secret
        run: |
          pytest apps/api/tests -v

  frontend-checks:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Typecheck & Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock-test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-test-anon-key
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
